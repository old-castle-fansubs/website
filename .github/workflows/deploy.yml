name: Deploy

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6

      - name: Install
        run: uv sync --locked

      - name: Check the migrations
        working-directory: app
        run: uv run python manage.py makemigrations --check --dry-run

      - name: Test
        run: uv run pytest

  deploy:
    needs: test
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          missing=""
          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY DEPLOY_KNOWN_HOSTS; do
            if [ -z "${!name}" ]; then
              missing="$missing $name"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Set these repository variables or secrets:$missing"
            exit 1
          fi
          umask 077
          trap 'rm -f key known_hosts' EXIT
          printf '%s\n' "$DEPLOY_SSH_KEY" > key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > known_hosts
          ssh -i key -o IdentitiesOnly=yes -o UserKnownHostsFile=known_hosts \
            "$DEPLOY_USER@$DEPLOY_HOST" -T /srv/oldcastle/update
