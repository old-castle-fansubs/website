[project]
name = "oc-website"
version = "0.1"
requires-python = ">=3.13"
dependencies = [
    "bleach",
    "django>=5.2,<5.3",
    "gunicorn",
    "markdown",
    "python-dotenv",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "pytest-django",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "oc_website.settings"
pythonpath = ["app"]
testpaths = ["app"]

[tool.black]
line-length = 79

[tool.isort]
multi_line_output = 3
include_trailing_comma = true
known_first_party = ["oc_website"]

[tool.mypy]
disallow_untyped_decorators = false
python_version = "3.13"

[tool.pylint.master]
jobs = 0

[tool.pylint.message_control]
disable = [
    "import-error",  # for pre-commit, which cannot install external modules
    "missing-docstring",
    "too-few-public-methods",
    "no-member",  # leave that to mypy
    "useless-return",  # false positives for `return None` that conflict with mypy
    "fixme",
]
module-rgx="(([a-z_][a-z0-9_]*)|([A-Z][a-zA-Z0-9]+)|([0-9]{4}_[a-z_][a-z0-9_]*))$"
